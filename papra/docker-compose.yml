services:
  papra:
    # image: ghcr.io/papra-hq/papra:latest
    image: papra-custom:latest
    build:
      context: https://github.com/magic0whi/papra.git#fix/pdf-special-fonts
      # context: /home/proteus/Works/Reference/papra
      dockerfile: packages/app/Dockerfile.rootless
    container_name: papra
    restart: unless-stopped
    ports:
      - 127.0.0.1:1221:1221
    env_file:
      - secrets.env
    environment:
      - APP_BASE_URL=https://papra.proteus.eu.org
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/proteus_ca.pub.pem
      - DOCUMENTS_OCR_LANGUAGES=chi_sim,chi_tra,eng
      - MAX_ORGANIZATION_COUNT_PER_USER=40
      - DOCUMENT_STORAGE_MAX_UPLOAD_SIZE=104857600
    volumes:
      - /srv/papra:/app/app-data
      # TODO: Use a variable to wrapper this
      - /home/proteus/Works/nixos_configs_flake/secrets/proteus_ca.pub.pem:/etc/ssl/certs/proteus_ca.pub.pem:ro
    user: 1000:1000
